name: Milkdrop renderer
version: "0.4.0"
slug: milkdrop_renderer
description: >-
  Draws the Milkdrop visualizer on this machine's GPU and streams it to a
  kiosk or screen, so the screen only has to show a small video.
url: https://github.com/A7QG59F2/ha-milkdrop-renderer
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# /dev/dri, so Chromium can draw on the machine's GPU (Intel/AMD, Vulkan)
video: true
# 8098 inside, 8190 on the machine (Music Assistant uses 8097, another app may use 8098)
ports:
  8098/tcp: 8190
ports_description:
  8098/tcp: Visualizer streams (to the kiosks), audio from devices, and /control for settings pages
options:
  width: 640
  height: 400
  fps: 30
  jpeg_quality: 80
  gpu: true
  audio_device: ""
  squeezelite_server: ""
  player_name: Visualizer
  music_assistant: ""
  music_assistant_token: ""
  player: ""
  channels: []
schema:
  width: int(160,1920)
  height: int(100,1200)
  fps: int(5,60)
  jpeg_quality: int(30,95)
  gpu: bool
  audio_device: str?
  squeezelite_server: str?
  player_name: str?
  music_assistant: str?
  music_assistant_token: password?
  player: str?
  channels:
    - name: str
      player: str?
      audio_device: str?
