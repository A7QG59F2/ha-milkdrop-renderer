name: Milkdrop renderer
version: "0.2.1"
slug: milkdrop_renderer
description: >-
  Draws the Milkdrop visualizer on this machine's GPU and streams it to a
  kiosk or screen, so the screen only has to show a small video.
url: https://github.com/A7QG59F2/ha-milkdrop-renderer
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# /dev/dri, so Chromium can draw on the machine's GPU (Intel/AMD, Vulkan)
video: true
# 8098 inside, 8097 on the machine (another app may use 8098 there)
ports:
  8098/tcp: 8097
ports_description:
  8098/tcp: Visualizer stream (to the kiosk), audio from the device, and /control for settings pages
options:
  width: 640
  height: 400
  fps: 30
  jpeg_quality: 80
  gpu: true
  audio_device: ""
schema:
  width: int(160,1920)
  height: int(100,1200)
  fps: int(5,60)
  jpeg_quality: int(30,95)
  gpu: bool
  audio_device: str?
